<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d9541a" />
    <meta name="description" content="Offline shop maintenance log for work orders, machines, parts and preventive maintenance." />
    <title>Shop Maintenance Log</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <header class="app-header">
      <button id="back-button" class="icon-button back-button" type="button" aria-label="Go back" hidden>
        <span aria-hidden="true">‹</span>
      </button>
      <div class="header-title">
        <span class="brand-mark" aria-hidden="true">ML</span>
        <h1 id="page-title">Shop Maintenance Log</h1>
      </div>
      <div class="header-sync" id="sync-pill" role="status" aria-live="polite" hidden></div>
      <button id="user-menu-button" class="icon-button user-button" type="button" aria-haspopup="menu" aria-expanded="false" hidden></button>
      <a class="icon-button" href="#/help" id="help-link" aria-label="Help">
        <span aria-hidden="true">?</span>
      </a>
      <a class="icon-button" href="#/settings" id="settings-link" aria-label="Settings">
        <span aria-hidden="true">⚙</span>
      </a>
    </header>

    <nav class="sidebar" aria-label="Main navigation (desktop)">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">ML</span>
        <span class="sidebar-app-name">Shop Maintenance Log</span>
      </div>
      <a class="btn btn-primary sidebar-new" href="#/jobs/new">+ Log repair</a>
      <div class="sidebar-links">
        <a class="sidebar-link" href="#/home" data-tab="home">Home</a>
        <a class="sidebar-link" href="#/jobs" data-tab="jobs"
          >Jobs <span class="nav-count" data-count="jobs"></span
        ></a>
        <a class="sidebar-link" href="#/machines" data-tab="machines">Machines</a>
        <a class="sidebar-link" href="#/parts" data-tab="parts"
          >Parts <span class="nav-count" data-count="parts"></span
        ></a>
        <a class="sidebar-link" href="#/pm" data-tab="pm"
          >PM <span class="nav-count" data-count="pm"></span
        ></a>
        <a class="sidebar-link" href="#/help" data-tab="help">Help</a>
        <a class="sidebar-link" href="#/settings" data-tab="settings">Settings</a>
      </div>
    </nav>

    <main id="app-main" tabindex="-1"></main>

    <a class="fab" id="fab" href="#/jobs/new" hidden>+ Log repair</a>

    <nav class="tabbar" aria-label="Main navigation">
      <a class="tab" href="#/home" data-tab="home">Home</a>
      <a class="tab" href="#/jobs" data-tab="jobs">Jobs</a>
      <a class="tab" href="#/machines" data-tab="machines">Machines</a>
      <a class="tab" href="#/parts" data-tab="parts">Parts</a>
      <a class="tab" href="#/pm" data-tab="pm">PM</a>
    </nav>

    <div id="dialog-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <noscript>This app needs JavaScript enabled.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
